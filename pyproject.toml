[tool.poetry]
name = "roland-super-mrc-tools"
version = "1.0.0"
description = "Bit-accurate Roland Super-MRC (.SNG) to Standard MIDI (SMF) converter and inspection tools"
authors = ["Roland Super-MRC Contributors"]
readme = "README.md"
license = "MIT"
packages = [{ include = "roland_super_mrc", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
typer = "^0.12.5"
click = "~=8.1.7"
mido = "^1.3.2"
rich = ">=13.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
mypy = "^1.11.2"
ruff = "^0.6.9"
pre-commit = "^3.8.0"
pyinstaller = "^6.22.3"

[tool.poetry.scripts]
sng2mid = "roland_super_mrc.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
