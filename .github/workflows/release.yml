name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: sng2mid-windows-x64.exe
            output_path: dist/sng2mid.exe
          - os: ubuntu-latest
            artifact_name: sng2mid-linux-x64
            output_path: dist/sng2mid
          - os: macos-latest
            artifact_name: sng2mid-macos-arm64
            output_path: dist/sng2mid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Build binary with PyInstaller
        run: poetry run pyinstaller --onefile --name sng2mid src/roland_super_mrc/cli.py

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp ${{ matrix.output_path }} release-artifacts/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
